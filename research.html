<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Research | Hongyu Ke</title>
    <meta name="description" content="Publications and research of Hongyu Ke.">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.1/css/academicons.min.css" integrity="sha512-b1ASx0WHgVFL5ZQhTgiPWX+68KjS38Jk87jg7pe+qC7q9YkEtFq0z7xCglv7qGIs/68d3mAp+StfC8WKC5SSAg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="assets/css/global.css">
</head>
<body data-page="research">
    <nav id="site-nav" class="navbar navbar-expand-sm navbar-light bg-light fixed-top shadow-sm"></nav>

    <main class="container wide-page-container">
        <div class="row justify-content-center wide-page-row" data-publication-filter-root>
            <!-- 左栏：研究方向筛选 + My Research（宽屏时吸顶） -->
            <div class="col-12 col-xl-3 mt-3">
                <div class="sticky-top sidebar-sticky">
                    <div id="topic-filter" class="research-summary-topic-list mb-2"></div>
                    <div id="research-summary"></div>
                </div>
            </div>

            <!-- 右栏：按年份分组的全部论文 -->
            <div class="col-12 col-xl-7 mt-3">
                <div class="card border-0 shadow-sm bg-white custom-radius">
                    <div class="card-body p-4">
                        Representative publications are <span class="selected-legend">highlighted.</span>
                    </div>
                </div>

                <div id="publication-filter-empty-state" class="card border-0 shadow-sm bg-white custom-radius mt-3" hidden>
                    <div class="card-body p-4 text-muted">No publications match the selected topic.</div>
                </div>

                <div id="publication-list"></div>
            </div>
        </div>
    </main>

    <footer id="site-footer" class="footer"></footer>

    <!-- 页面内容来自 data/ 目录 -->
    <script src="data/profile.js"></script>
    <script src="data/publications.js"></script>
    <script src="assets/js/main.js"></script>
    <!-- Bootstrap 交互（手机端菜单折叠） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.slim.min.js" integrity="sha512-/DXTXr6nQodMUiq+IUJYCt2PPOUjrHJ9wFrqpJ3XkgPNOZVfMok7cRw6CSxyCQxXn6ozlESsSh1/sMCTF1rL/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.bundle.min.js" integrity="sha512-wV7Yj1alIZDqZFCUQJy85VN+qvEIly93fIQAN7iqDFCPEucLCeNFz4r35FCo9s6WrpdDQPi80xbljXB8Bjtvcg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
